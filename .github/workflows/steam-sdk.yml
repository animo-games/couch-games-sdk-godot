name: Steam SDK without App ID
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts-and-packages:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Acquire and verify pinned tools
        id: tools
        run: python tests/steam/acquire.py --cache "${{ runner.temp }}/sdk-dependencies"
      - name: Steam-free contracts and regression gates
        run: >-
          python tests/steam/run.py --godot "${{ steps.tools.outputs.godot }}"
          --regressions --fixtures "${{ steps.tools.outputs.fixtures }}"
          --webrtc-zip "${{ steps.tools.outputs.webrtc }}" --logs ci-logs
      - name: Build, inspect and smoke native host packages
        run: >-
          python fixtures/steam/package/build.py --godot "${{ steps.tools.outputs.godot }}"
          --templates "${{ steps.tools.outputs.templates }}"
          --godotsteam-zip "${{ steps.tools.outputs.steam }}" --output ci-packages
      - name: Install pinned browser runner
        if: runner.os == 'Linux'
        working-directory: fixtures/steam/package
        run: npm ci --ignore-scripts
      - name: Install pinned Chromium
        if: runner.os == 'Linux'
        working-directory: fixtures/steam/package
        run: npx --no-install playwright install --with-deps chromium
      - name: Execute Web packages in Chromium
        if: runner.os == 'Linux'
        run: node fixtures/steam/package/web.mjs ci-packages
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-evidence-${{ runner.os }}
          if-no-files-found: error
          path: |
            ci-logs
            ci-packages/logs
            ci-packages/*.json
            ci-packages/linux-*/**
            ci-packages/windows-*/**
            ci-packages/web-*/**
